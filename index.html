<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NothingApp">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Zero</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #181818;
      --border: #282828;
      --accent: #ffffff;
      --sub: #777777;
      --rage: #ff3333;
    }

    .light-theme {
      --bg: #f5f5f5;
      --card: #ffffff;
      --border: #e0e0e0;
      --accent: #111111;
      --sub: #888888;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--accent);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 30px 20px;
      box-sizing: border-box;
      transition: background 0.3s, color 0.3s;
      user-select: none;
    }

    .nav { width: 100%; max-width: 350px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; color: var(--sub); }
    
    .theme-toggle {
      background: transparent; border: 1px solid var(--border);
      color: var(--accent); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 0.75rem;
    }

    .center { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; max-width: 350px; }

    .btn {
      width: 160px; height: 160px; border-radius: 50%;
      background: linear-gradient(145deg, var(--card), var(--bg));
      border: 2px solid var(--border); color: var(--accent);
      font-size: 1.2rem; font-weight: 800; cursor: pointer; outline: none;
      transition: transform 0.08s ease, border-color 0.2s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .btn:active { transform: scale(0.88); }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 20px; width: 100%; text-align: center; box-sizing: border-box;
    }

    .count { font-size: 3rem; font-weight: 800; margin: 5px 0; }
    .response { font-size: 0.95rem; color: var(--sub); min-height: 45px; margin-top: 10px; font-style: italic; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }

    .mini-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
    .mini-card-title { font-size: 0.65rem; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; }
    .mini-card-val { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }

    .action-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--accent); padding: 12px 20px; border-radius: 20px;
      cursor: pointer; font-size: 0.85rem; width: 100%; font-weight: 600;
    }

    .rage-mode { animation: flash 0.3s infinite alternate; }
    @keyframes flash {
      from { background: var(--bg); }
      to { background: #330000; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <div class="title">Productivity Zero</div>
    <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
  </div>

  <div class="center">
    <button class="btn" id="mainBtn" onclick="tap()">DO NOT TAP</button>

    <div class="card">
      <div style="font-size: 0.7rem; color: var(--sub); letter-spacing: 1px;">WASTED TAPS</div>
      <div class="count" id="c">0</div>
      <div class="response" id="r">Tap to begin doing nothing.</div>
    </div>

    <div class="stats-grid">
      <div class="mini-card">
        <div class="mini-card-title">Focus Status</div>
        <div class="mini-card-val" id="idleStatus">Active</div>
      </div>
      <div class="mini-card">
        <div class="mini-card-title">Current Rank</div>
        <div class="mini-card-val" id="rank">Novice</div>
      </div>
    </div>

    <button class="action-btn" onclick="shareStats()">Flex Your Waste of Time</button>
  </div>

  <div style="font-size: 0.7rem; color: var(--sub);">v2.0 • Ultimate Digital Detox</div>

  <script>
    let count = parseInt(localStorage.getItem('taps') || '0');
    let isLight = localStorage.getItem('theme') === 'light';
    let tapTimes = [];
    let idleTimer;

    if (isLight) document.body.classList.add('light-theme');
    updateDisplay();
    resetIdleTimer();

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTapSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      // Pitch raises slightly as count increases
      const pitch = 150 + (count % 50) * 5;
      osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    async function tap() {
      playTapSound();
      if (navigator.vibrate) navigator.vibrate(25);

      count++;
      localStorage.setItem('taps', count);
      
      // Speed check for Rage Mode
      const now = Date.now();
      tapTimes.push(now);
      tapTimes = tapTimes.filter(t => now - t < 1000);
      
      const r = document.getElementById('r');

      if (tapTimes.length > 5) {
        document.body.classList.add('rage-mode');
        r.innerText = '"ALERT: CALM DOWN. YOU ARE BEING TOO PRODUCTIVE!"';
      } else {
        document.body.classList.remove('rage-mode');
        r.style.opacity = '0.4';
        try {
          const res = await fetch('/api/tap?count=' + count);
          const data = await res.json();
          r.innerText = '"' + data.message + '"';
        } catch (e) {
          r.innerText = '"You broke nothing."';
        }
        r.style.opacity = '1';
      }

      // Milestones confetti
      if (count === 10 || count === 69 || count === 100 || count === 500) {
        confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
      }

      updateDisplay();
      resetIdleTimer();
    }

    function resetIdleTimer() {
      document.getElementById('idleStatus').innerText = "Tapping...";
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.getElementById('idleStatus').innerText = "Pure Nothingness 🧘";
      }, 5000);
    }

    function updateDisplay() {
      document.getElementById('c').innerText = count;
      let rank = "Novice";
      if (count > 25) rank = "Procrastinator";
      if (count > 100) rank = "Time Master";
      if (count > 300) rank = "Zen God";
      document.getElementById('rank').innerText = rank;
    }

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
    }

    function shareStats() {
      const msg = `I reached rank '${document.getElementById('rank').innerText}' on Productivity Zero by doing absolutely nothing ${count} times.`;
      if (navigator.share) navigator.share({ title: 'Productivity Zero', text: msg });
      else alert(msg);
    }
  </script>
</body>
</html>
